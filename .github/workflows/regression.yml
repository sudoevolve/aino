name: Regression

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  wayland:
    name: Pure Wayland / Weston
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAYLAND_DISPLAY: aino-ci
    steps:
      - uses: actions/checkout@v4
      - name: Wayland runtime and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston libwayland-client0 libwayland-cursor0 \
            libxkbcommon0 libfreetype6 libfontconfig1 libgdk-pixbuf-2.0-0 fonts-noto-cjk
      - name: Build release probes without X11
        run: |
          cmake -S . -B build/wayland -DAINO_WAYLAND=ON -DAINO_BUILD_TESTS=ON -DAINO_BUILD_SSH=OFF
          cmake --build build/wayland --parallel 2 --target aino_test_wayland aino_test_window_wake aino_test_smoke aino_test_pixels aino_test_link_contract
      - name: Native protocol and lifecycle checks
        shell: bash
        run: |
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/aino-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --shell=desktop-shell.so \
            --socket="$WAYLAND_DISPLAY" --width=1600 --height=1000 --idle-time=0 \
            --no-config --log="$RUNNER_TEMP/aino-weston.log" &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            if ! kill -0 "$compositor" 2>/dev/null; then cat "$RUNNER_TEMP/aino-weston.log"; exit 1; fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          ctest --test-dir build/wayland --output-on-failure -R '^(wayland|window_wake|smoke|pixels|link_contract)$'
      - name: Preserve Wayland reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-release-reports
          path: |
            build/wayland/Testing/Temporary/
            build/wayland/test-output/
            ${{ runner.temp }}/aino-weston.log
          if-no-files-found: ignore

  regression:
    name: ${{ matrix.os }} / CMake + CTest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: X11, fonts, SSH headers and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libgdk-pixbuf-2.0-0 librsvg2-common adwaita-icon-theme \
            libfreetype6 libfontconfig1 libfontconfig libssh2-1-dev \
            xvfb xfonts-base fonts-dejavu-core fonts-noto-cjk
          fc-cache -f

      - name: macOS SSH development library
        if: runner.os == 'macOS'
        run: brew install libssh2

      - name: Prepare pinned MSVC SSH dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/third_party | Out-Null
          $packages = @(
            @{url='https://www.libssh2.org/download/libssh2-1.11.1.tar.gz'; file='libssh2.tar.gz'; hash='d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7'},
            @{url='https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.6.2.tar.gz'; file='mbedtls.tar.gz'; hash='f4a876b1f6921ad0aefb445f974ef62414d33928640b2c45555c5e64a196a1a8'}
          )
          foreach ($package in $packages) {
            $archive = Join-Path 'build/third_party' $package.file
            Invoke-WebRequest $package.url -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.hash) { throw 'SSH source checksum mismatch' }
            tar -xzf $archive -C build/third_party
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/build_mbedtls_static.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deps = (Resolve-Path build/third_party).Path
          cmake -S "$deps/libssh2-1.11.1" -B "$deps/l2mbed" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DENABLE_ZLIB_COMPRESSION=OFF -DCRYPTO_BACKEND=mbedTLS -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DMBEDTLS_INCLUDE_DIR=$deps/mbedtls-3.6.2/include" "-DMBEDCRYPTO_LIBRARY=$deps/mbedtls-3.6.2/mbedtls_all.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$deps/l2mbed" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure with SSH on Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -DAINO_BUILD_TESTS=ON -DAINO_BUILD_SSH=ON

      - name: Configure with SSH on Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DAINO_BUILD_TESTS=ON -DAINO_BUILD_SSH=ON

      - name: Build examples and probes
        run: cmake --build build/ci --config Release --parallel 2

      - name: Isolated SSH server dependency
        run: python -m pip install paramiko==4.0.0

      - name: Local SSH and transfer release checks on Windows
        if: runner.os == 'Windows'
        run: python tools/ssh_release_check.py --engine build/ci/Release/aino_test_ssh_protocol.exe --ui build/ci/Release/aino_test_ssh_ui.exe

      - name: Local SSH and high descriptor release checks on POSIX
        if: runner.os != 'Windows'
        run: python tools/ssh_release_check.py --engine build/ci/aino_test_ssh_protocol

      - name: CTest
        if: runner.os != 'Linux'
        run: ctest --test-dir build/ci -C Release --output-on-failure --parallel 2

      - name: CTest on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/ci -C Release --output-on-failure --parallel 2

      - name: X11 CJK fallback with a short font chain
        if: runner.os == 'Linux'
        env:
          AINO_X11_TRACE: "1"
          AINO_X11_CHAIN_CAP: "4"
        run: |
          xvfb-run -a build/ci/aino_test_pixels > build/ci/narrow.txt 2>&1
          cat build/ci/narrow.txt
          grep -q "cjk at " build/ci/narrow.txt

      - name: Preserve reports and native frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ runner.os }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/test-output/
            build/ci/narrow.txt
          if-no-files-found: ignore
