name: CI

# 三平台各跑两件事：
#   1. ci_smoke   —— 能编译、能开窗、能跑满 20 帧（冒烟）
#   2. ci_pixels  —— 30 项像素断言，直接从后备缓冲读像素（画得对不对）
#
# 现状：
#   · Windows —— 唯一经过真桌面验证的后端，这个 job 必须绿；
#   · Linux   —— X11 后端，靠 xvfb 虚拟屏跑，像素断言 2026-10-20 接入；
#   · macOS   —— Cocoa 后端，像素断言同日接入。
#   三个平台都是硬门槛，谁退步 CI 直接红。
#
# 为什么像素断言能跨平台：tools/verify_gallery.py 走 PrintWindow，只能 Windows；
# tools/ci_pixels.cpp 直接读 Canvas.px（三个后端都往同一块缓冲里画），
# 而且只断言与字形无关的性质（几何 / 颜色 / 裁剪 / 阴影 / 墨迹范围），
# 所以 GDI / Xft / CoreText 三种字形光栅都能过。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 导入 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT examples\gallery.cpp user32.lib gdi32.lib /Fe:gallery.exe
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT tools\ci_smoke.cpp user32.lib gdi32.lib /Fe:ci_smoke.exe
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT tools\ci_pixels.cpp user32.lib gdi32.lib /Fe:ci_pixels.exe

      - name: 冒烟（跑满 20 帧）
        run: .\ci_smoke.exe

      - name: 像素断言（30 项）
        env:
          AINO_PIX_BMP: "1"
        run: .\ci_pixels.exe

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-windows
          path: ci_frame_*.bmp
          if-no-files-found: ignore

  linux:
    name: Linux / X11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 X11 头文件、虚拟屏、基础字体与 Xft
        run: |
          sudo apt-get update
          # libxft-dev 提供 <X11/Xft/Xft.h>：有了它就编进 Xft（FreeType 灰度抗锯齿），
          # 文字才和 Windows/macOS 一个观感。没有它也能编，只是退回 1bit 点阵字体。
          # xfonts-base 是核心 X 的 XLFD 位图字体（fixed / 6x13 ...），现在只作为
          # "Xft 不可用"兜底路径的字体来源 —— 但仍然要装，否则那条兜底路会一个字都没有。
          sudo apt-get install -y --no-install-recommends libx11-dev libxft-dev xvfb xfonts-base fonts-dejavu-core
          # Xft 走 fontconfig，裸容器里字体缓存可能还没建：不建的话 fc-match 找不到
          # DejaVu，XftFontOpenName 会退化到某个位图字体 —— 抗锯齿断言就会红。
          fc-cache -f > /dev/null

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          g++ -std=c++17 -O2 -Wall examples/gallery.cpp -o gallery -lX11 -lXft
          g++ -std=c++17 -O2 -Wall tools/ci_smoke.cpp -o ci_smoke -lX11 -lXft
          g++ -std=c++17 -O2 -Wall tools/ci_pixels.cpp -o ci_pixels -lX11 -lXft

      - name: 冒烟（xvfb 虚拟屏，跑满 20 帧）
        run: xvfb-run -a ./ci_smoke

      - name: 像素断言（30 项，xvfb 虚拟屏）
        env:
          AINO_PIX_BMP: "1"
        run: xvfb-run -a ./ci_pixels

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-linux
          path: ci_frame_*.bmp
          if-no-files-found: ignore

  macos:
    name: macOS / Cocoa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          clang++ -std=c++17 -O2 examples/gallery.cpp -o gallery \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices
          clang++ -std=c++17 -O2 tools/ci_smoke.cpp -o ci_smoke \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices
          clang++ -std=c++17 -O2 tools/ci_pixels.cpp -o ci_pixels \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices

      - name: 冒烟（runner 没有交互桌面，能开窗就算过）
        run: ./ci_smoke

      - name: 像素断言（30 项）
        env:
          AINO_PIX_BMP: "1"
        run: ./ci_pixels

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-macos
          path: ci_frame_*.bmp
          if-no-files-found: ignore
