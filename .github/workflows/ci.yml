name: CI

# 三平台各跑两件事：
#   1. ci_smoke   —— 能编译、能开窗、能跑满 20 帧（冒烟）
#   2. ci_pixels  —— 30 项像素断言，直接从后备缓冲读像素（画得对不对）
#
# 现状：
#   · Windows —— 唯一经过真桌面验证的后端，这个 job 必须绿；
#   · Linux   —— X11 后端，靠 xvfb 虚拟屏跑，像素断言 2026-10-20 接入；
#   · macOS   —— Cocoa 后端，像素断言同日接入。
#   三个平台都是硬门槛，谁退步 CI 直接红。
#
# 为什么像素断言能跨平台：tools/verify_gallery.py 走 PrintWindow，只能 Windows；
# tools/ci_pixels.cpp 直接读 Canvas.px（三个后端都往同一块缓冲里画），
# 而且只断言与字形无关的性质（几何 / 颜色 / 裁剪 / 阴影 / 墨迹范围），
# 所以 GDI / Xft / CoreText 三种字形光栅都能过。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 导入 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT examples\gallery.cpp user32.lib gdi32.lib /Fe:gallery.exe
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT tools\ci_smoke.cpp user32.lib gdi32.lib /Fe:ci_smoke.exe
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT tools\ci_pixels.cpp user32.lib gdi32.lib /Fe:ci_pixels.exe

      - name: 冒烟（跑满 20 帧）
        run: .\ci_smoke.exe

      - name: 像素断言（34 项）
        env:
          AINO_PIX_BMP: "1"
        run: .\ci_pixels.exe

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-windows
          path: ci_frame_*.bmp
          if-no-files-found: ignore

  linux:
    name: Linux / X11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 X11 头文件、虚拟屏、字体与 freetype/fontconfig 运行时
        run: |
          sudo apt-get update
          # 只装**运行时**包 libfreetype6 / libfontconfig1，不装 -dev：aino 不 include
          # 任何第三方头、也不加 -l，运行时 dlopen 取符号。CI 这样装才对得上用户的
          # 真实环境（普通 Ubuntu 桌面只有运行时包，开发包要另外 apt install）。
          # fonts-noto-cjk 是中文的兜底字体：没有它「中文」这条断言必然是 tofu 方块，
          # 而那正是用户报的 bug，所以必须在 CI 里能复现、也必须被钉住。
          # xfonts-base 是核心 X 的 XLFD 位图字体（fixed / 6x13 ...），只作为
          # "freetype 加载失败"时的兜底来源 —— 但仍然要装，否则那条兜底路一个字都没有。
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libfreetype6 libfontconfig1 libfontconfig \
            xvfb xfonts-base fonts-dejavu-core fonts-noto-cjk
          # 裸容器里字体缓存可能还没建：不建的话 FcFontMatch 找不到 DejaVu / Noto，
          # 抗锯齿和中文断言都会红。
          fc-cache -f > /dev/null
          fc-match "sans" ; fc-match "sans:lang=zh-cn"

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          # 不需要 -lXft / -lfreetype / -lfontconfig：都是运行时 dlopen 的。
          # -ldl 在老 glibc（< 2.34）上必须，新版是空库，加上无害。
          g++ -std=c++17 -O2 -Wall examples/gallery.cpp -o gallery -lX11 -ldl
          g++ -std=c++17 -O2 -Wall tools/ci_smoke.cpp -o ci_smoke -lX11 -ldl
          g++ -std=c++17 -O2 -Wall tools/ci_pixels.cpp -o ci_pixels -lX11 -ldl

      - name: 冒烟（xvfb 虚拟屏，跑满 20 帧）
        run: xvfb-run -a ./ci_smoke

      - name: 像素断言（34 项，xvfb 虚拟屏）
        env:
          AINO_PIX_BMP: "1"
          AINO_X11_TRACE: "1"
        run: |
          set +e
          xvfb-run -a ./ci_pixels 2> pixels_trace.txt
          rc=$?
          if [ $rc -ne 0 ]; then echo "--- trace ---"; cat pixels_trace.txt; fi
          exit $rc

      # 兜底链自检：把链砍到 4 条（DejaVu Sans 的那几个 style 正好占满），
      # 汉字仍然必须画出来 —— 这就是用户机器上「中文全消失了，但代码块里的
      # 中文还有」的原样，只是把截断点压到最小。日志里要能看见 "cjk at N"：
      # 说明 CJK 字体是被 charset 探测钉进链的，不是碰巧排进前几条。
      - name: 字体兜底链自检（链砍到 4 条仍要画出中文）
        run: |
          AINO_X11_TRACE=1 AINO_X11_CHAIN_CAP=4 xvfb-run -a ./ci_pixels > narrow.txt 2> trace.txt
          tail -2 narrow.txt
          echo "--- 兜底链（去重）---"
          grep "chain" trace.txt | sort -u | head -6
          grep -q "cjk at " trace.txt

      # 布局自检：gallery 首帧会把全部 45 页量一遍，写出 `# over=N under=M total=K`。
      # over 必须为 0 —— 这正是 Windows 上 `tools/regress.py` 卡的那条。
      # 放在 Linux 上跑的意义：Xft 的行高/字宽和 GDI 不一样，某些手填高度的卡片
      # 在 Windows 上刚好装下、换到 Xft 就可能溢出一行。
      - name: 布局自检（gallery 全页，over 必须为 0）
        run: |
          rm -f layout.txt
          AINO_LAYOUT_REPORT=layout.txt timeout 20 xvfb-run -a ./gallery || true
          echo "--- layout report ---"
          cat layout.txt 2>/dev/null || { echo "没有产出布局报告"; exit 1; }
          grep -q "# over=0 " layout.txt

      # 整窗截图：xvfb 里没有交互桌面，人工核对"画成什么样"只能靠这个。
      # 中文、词标对齐、配色都是靠它拍下来的，不看图就只能靠猜。
      - name: 整窗截图（xvfb）
        run: |
          rm -f gallery_linux.bmp
          AINO_SHOT_BMP=gallery_linux.bmp timeout 20 xvfb-run -a ./gallery || true
          ls -l gallery_linux.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-linux
          path: gallery_linux.bmp
          if-no-files-found: warn

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-linux
          path: ci_frame_*.bmp
          if-no-files-found: ignore

  macos:
    name: macOS / Cocoa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 gallery、冒烟程序与像素断言
        run: |
          clang++ -std=c++17 -O2 examples/gallery.cpp -o gallery \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices
          clang++ -std=c++17 -O2 tools/ci_smoke.cpp -o ci_smoke \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices
          clang++ -std=c++17 -O2 tools/ci_pixels.cpp -o ci_pixels \
            -framework Cocoa -framework CoreText -framework CoreGraphics -framework ApplicationServices

      - name: 冒烟（runner 没有交互桌面，能开窗就算过）
        run: ./ci_smoke

      - name: 像素断言（34 项）
        env:
          AINO_PIX_BMP: "1"
        run: ./ci_pixels

      - name: 失败时保留抓到的帧
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-macos
          path: ci_frame_*.bmp
          if-no-files-found: ignore
