name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libssh2-1-dev
      - name: macOS SSH library
        if: runner.os == 'macOS'
        run: brew install libssh2
      - name: Configure Windows core examples
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -DAINO_BUILD_TESTS=OFF -DAINO_BUILD_SSH=OFF
      - name: Configure Linux and macOS examples with SSH
        if: runner.os != 'Windows'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DAINO_BUILD_TESTS=OFF -DAINO_BUILD_SSH=ON
      - name: Compile examples
        run: cmake --build build/ci --config Release --parallel 2
